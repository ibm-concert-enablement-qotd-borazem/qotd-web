apiVersion: v1
kind: Service
metadata:
  name: qotd-web
  labels:
    app: qotd
    tier: api
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: qotd-web
---
apiVersion: v1
kind: Service
metadata:
  name: qotd-web-svc
  labels:
    app: qotd
    tier: api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: svc
  selector:
    app: qotd-web
