kind: Deployment
apiVersion: apps/v1
metadata:
  name: qotd-web
  labels:
    app: qotd
    tier: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qotd-web
  template:
    metadata:
      labels:
        app: qotd-web
    spec:
      restartPolicy: Always
      volumes:
        - name: settings
          configMap:
            name: qotd-web-factory-settings
      containers:
        - name: qotd-web
          image: registry.gitlab.com/quote-of-the-day/qotd-web:latest
          imagePullPolicy: Always
          volumeMounts:
            - name: settings
              mountPath: /app/data
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: svc
              containerPort: 8080
              protocol: TCP
          env:
            - name: LOCAL_LOGGING
              value: "false"
            - name: ENABLE_INSTANA
              value: "false"
            - name: QUOTE_SVC
              value: "qotd-quote.qotd.svc.cluster.local:3001"
            - name: AUTHOR_SVC
              value: "qotd-author.qotd.svc.cluster.local:3002"
            - name: RATING_SVC
              value: "qotd-rating.qotd.svc.cluster.local:3004"
            - name: PDF_SVC
              value: "qotd-pdf.qotd.svc.cluster.local:3005"
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 10
            timeoutSeconds: 2
            periodSeconds: 20
            successThreshold: 1
            failureThreshold: 5
          resources:
            requests:
              cpu: "10m"
              memory: "80Mi"
            limits:
              cpu: "500m"
              memory: "500Mi"
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: qotd-web-factory-settings
  namespace: qotd
data:
  factory_settings.json: |-
    {
        "api": {"mean": 10, "stdev": 20, "min":0,"max":200},
        "cpu": {"mean": 0.35, "stdev": 0.2, "min":0,"max":1},
        "mem": {"mean": 2548570, "stdev": 500000, "min":204857, "max":4718592}
    }
