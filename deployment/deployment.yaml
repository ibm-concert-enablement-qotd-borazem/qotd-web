kind: Deployment
apiVersion: apps/v1
metadata:
  name: qotd-web
  labels:
    app: qotd
    tier: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qotd-web
  template:
    metadata:
      labels:
        app: qotd-web
    spec:
      restartPolicy: Always
      containers:
        - name: qotd-web
          image: registry.gitlab.com/quote-of-the-day/qotd-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: svc
              containerPort: 8080
              protocol: TCP
          env:
            - name: LOCAL_LOGGING
              value: "false"
            - name: ENABLE_INSTANA
              value: "false"
            - name: QUOTE_SVC_HOST
              value: "qotd-quote.qotd.svc.cluster.local"
            - name: QUOTE_SVC_PORT
              value: "3001"
            - name: AUTHOR_SVC_HOST
              value: "qotd-author.qotd.svc.cluster.local"
            - name: AUTHOR_SVC_PORT
              value: "3002"
            - name: RATING_SVC_HOST
              value: "qotd-rating.qotd.svc.cluster.local"
            - name: RATING_SVC_PORT
              value: "3004"
            - name: PDF_SVC_HOST
              value: "qotd-pdf.qotd.svc.cluster.local"
            - name: PDF_SVC_PORT
              value: "3005"